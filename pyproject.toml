[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mealmate"
version = "0.1.0"
description = "MealMate recipe-first grocery draft verification"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "fastapi>=0.115,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_llm: calls a real language model provider; excluded from deterministic test suites"]
